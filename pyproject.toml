[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "osdesign-cpu-runner"
version = "0.1.0"
description = "CPU quota experiment runner for openEuler"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
osdesign = "runner.cli:main"

[project.optional-dependencies]
dev = ["jsonschema>=4.18,<5", "ruff==0.17.5"]
report = ["jsonschema>=4.18,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["work", "results", "evidence"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Source-checkout entrypoints explicitly bootstrap sys.path before project imports.
"experiments/*.py" = ["E402"]
"tests/test_pipeline.py" = ["E402"]
"tests/test_comparison.py" = ["E402"]
