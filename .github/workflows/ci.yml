name: Pure unit tests and schemas
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: src
      OSDESIGN_INTEGRATION: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      # systemd/cgroup integration tests require a real target environment.
      # Existing OSDESIGN_INTEGRATION gates deliberately skip them here.
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_contracts.py examples/cpu.json --config
      - run: python scripts/validate_contracts.py examples/measured-run-1.1.json
      # Ruff is not configured yet (task 17); enable it after that task.
