[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "osdesign-cpu-runner"
version = "0.1.0"
description = "CPU quota experiment runner for openEuler"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
osdesign = "runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
